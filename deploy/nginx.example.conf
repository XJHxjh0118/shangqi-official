# Nginx 反代示例：三域名 + HTTPS
#
# 适用场景：
#   - Docker Compose 已在宿主机映射端口（默认 3000 / 8080 / 3001）
#   - 本文件放在宿主机 Nginx（非容器内 admin 自带的 nginx）
#
# 域名规划：
#   https://www.example.com   → 127.0.0.1:3000  (官网 SSR)
#   https://admin.example.com → 127.0.0.1:8080  (管理后台，容器内 nginx 已反代 /car)
#   https://api.example.com   → 127.0.0.1:3001  (公开 API + /uploads)
#
# 使用前：
#   1. 替换 example.com 为你的域名
#   2. 用 certbot 申请证书，或替换 ssl_certificate 路径
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 对应 .env.production：
#   NUXT_PUBLIC_SITE_URL=https://www.example.com
#   NUXT_PUBLIC_API_BASE=https://api.example.com/car
#   PUBLIC_BASE_URL=https://api.example.com
#   NUXT_IMAGE_DOMAINS=www.example.com,api.example.com
#   CORS_ORIGINS=https://www.example.com
#   WEB_PORT=3000
#   API_PORT=3001
#   ADMIN_PORT=8080
#
# 修改 .env 后 rebuild 官网：
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build website

# ---- 可选：限制直连 IP:端口（仅允许本机 Nginx 反代）----
# 生产环境可在防火墙关闭 3000/3001/8080 的公网入站，只留 80/443。

# ============================================================
# 官网 — www.example.com
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    # certbot --nginx -d www.example.com
    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# 管理后台 — admin.example.com
# （Admin 容器 nginx 已将 /car、/uploads 反代到 api:3001）
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# 公开 API — api.example.com
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # 静态图片直出，减轻 Node 压力（PM2 路径示例）
    location /uploads/ {
        alias /www/wwwroot/shangqi/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
