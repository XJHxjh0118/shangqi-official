# 生产环境一键编排：MySQL + API + Admin + 官网 SSR
# 用法见 DEPLOY.md

name: official-site

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-official_site}
      MYSQL_USER: ${MYSQL_USER:-site}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-site123456}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root123456}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - official-site

  api:
    build:
      context: ./backstage-management/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-site}:${MYSQL_PASSWORD:-site123456}@mysql:3306/${MYSQL_DATABASE:-official_site}
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 中设置 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env.production 中设置 JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: uploads
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/car/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - official-site

  admin:
    build:
      context: ./backstage-management/admin
      dockerfile: Dockerfile
      args:
        BUILD_MODE: production
        VITE_API_BASE_URL: /car
        VITE_PUBLIC_PATH: /
        VITE_ROUTER_HISTORY: hash
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${ADMIN_PORT:-8080}:80'
    networks:
      - official-site

  website:
    build:
      context: ./official-website
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3001/car}
        NUXT_IMAGE_DOMAINS: ${NUXT_IMAGE_DOMAINS:-localhost,127.0.0.1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - official-site

volumes:
  mysql_data:
  api_uploads:

networks:
  official-site:
    driver: bridge
